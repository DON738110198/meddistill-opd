[project]
name = "medical-opd"
version = "0.1.0"
description = "Auditable medical on-policy distillation and capability restoration for Qwen 4B"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "datasets==5.0.0",
  "huggingface-hub>=1.0,<2",
  "numpy>=2.3,<3",
  "pytrio==0.2.8",
  "transformers>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]
viz = [
  "matplotlib>=3.10,<4",
]

[project.urls]
Repository = "https://github.com/DON738110198/meddistill-opd"
Documentation = "https://github.com/DON738110198/meddistill-opd#readme"

[project.scripts]
medical-opd = "medical_opd.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_opd"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
